<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="popupTitle">BatchShot</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <div class="header-title-group">
          <img src="../icons/icon-48.png" alt="" class="header-icon">
          <h1 data-i18n="popupTitle">BatchShot</h1>
        </div>
        <div class="header-actions">
          <button id="currentTabButton" type="button" class="icon-button" data-i18n-title="currentTabButton" aria-label="Capture current page">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"></path>
              <circle cx="12" cy="13" r="3"></circle>
            </svg>
          </button>
          <button id="currentWindowTabsButton" type="button" class="icon-button" data-i18n-title="currentWindowTabsButton" aria-label="Capture all tabs in current window">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m22 11-1.296-1.296a2.4 2.4 0 0 0-3.408 0L11 16"></path>
              <path d="M4 8a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2"></path>
              <circle cx="13" cy="7" r="1" fill="currentColor"></circle>
              <rect x="8" y="2" width="14" height="14" rx="2"></rect>
            </svg>
          </button>
        </div>
      </header>

      <section id="urlSection" class="field url-section">
        <div class="section-head">
          <div class="segmented" role="tablist" aria-label="URL input mode">
            <button id="listModeButton" type="button" role="tab" class="mode-tab" data-mode="list" data-i18n="urlModeList">List</button>
            <button id="templateModeButton" type="button" role="tab" class="mode-tab" data-mode="template" data-i18n="urlModeTemplate">Template</button>
          </div>
        </div>

        <div id="urlListLabelWrapper" class="field compact">
          <div class="field-label-row">
            <label for="urlList" data-i18n="urlListLabel">URLs</label>
            <span id="urlCountBadge" class="count-badge" hidden>0</span>
            <div class="history-anchor">
              <button id="extractLinksButton" type="button" class="history-button" data-i18n-title="extractLinksButton" aria-label="Extract links from current page">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M10 13a5 5 0 0 0 7.1 0l2.8-2.8a5 5 0 0 0-7.1-7.1L11.2 4.7"></path>
                  <path d="M14 11a5 5 0 0 0-7.1 0l-2.8 2.8a5 5 0 0 0 7.1 7.1l1.6-1.6"></path>
                </svg>
              </button>
              <button id="urlListHistoryButton" type="button" class="history-button" data-history="urls" data-i18n-title="historyUrlsButton" aria-label="Show URL history" aria-expanded="false">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 12a9 9 0 1 0 3-6.7"></path>
                  <path d="M3 3v6h6"></path>
                  <path d="M12 7v5l3 2"></path>
                </svg>
              </button>
              <button id="urlListClearButton" type="button" class="history-button" data-clear-input="urls" data-i18n-title="clearUrlsButton" aria-label="Clear URL list">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"></path>
                  <path d="M22 21H7"></path>
                  <path d="m5 11 9 9"></path>
                </svg>
              </button>
              <div id="urlListHistoryMenu" class="history-menu" hidden></div>
            </div>
          </div>
          <div id="urlListPane" class="url-pane" hidden>
            <textarea id="urlList" rows="8" spellcheck="false" data-i18n-placeholder="urlListPlaceholder"></textarea>
          </div>
        </div>

        <div id="urlTemplatePane" class="url-pane template-pane" hidden>
          <div class="template-inputs-row">
            <div class="field compact">
              <div class="field-label-row">
                <label id="urlTemplateLabel" for="urlTemplate" data-i18n="urlTemplateLabel">URL template</label>
                <span id="urlTemplateCountBadge" class="count-badge">0</span>
                <div class="history-anchor">
                  <button id="urlTemplateHistoryButton" type="button" class="history-button" data-history="templates" data-i18n-title="historyTemplatesButton" aria-label="Show template history" aria-expanded="false">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M3 12a9 9 0 1 0 3-6.7"></path>
                      <path d="M3 3v6h6"></path>
                      <path d="M12 7v5l3 2"></path>
                    </svg>
                  </button>
                  <button id="urlTemplateClearButton" type="button" class="history-button" data-clear-input="templates" data-i18n-title="clearTemplateButton" aria-label="Clear URL template">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"></path>
                      <path d="M22 21H7"></path>
                      <path d="m5 11 9 9"></path>
                    </svg>
                  </button>
                  <div id="urlTemplateHistoryMenu" class="history-menu" hidden></div>
                </div>
              </div>
              <div class="template-textarea-wrapper">
                <textarea id="urlTemplate" spellcheck="false" data-i18n-placeholder="urlTemplatePlaceholder" wrap="off" class="no-wrap"></textarea>
              </div>
            </div>

            <div class="field compact">
              <div class="field-label-row">
                <label for="urlTemplateItems" data-i18n="urlTemplateItemsLabel">Text list</label>
                <span id="urlTemplateItemsCountBadge" class="count-badge">0</span>
                <div class="history-anchor">
                  <button id="urlTemplateItemsHistoryButton" type="button" class="history-button" data-history="templateItems" data-i18n-title="historyTemplateItemsButton" aria-label="Show text list history" aria-expanded="false">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M3 12a9 9 0 1 0 3-6.7"></path>
                      <path d="M3 3v6h6"></path>
                      <path d="M12 7v5l3 2"></path>
                    </svg>
                  </button>
                  <button id="urlTemplateItemsClearButton" type="button" class="history-button" data-clear-input="templateItems" data-i18n-title="clearTemplateItemsButton" aria-label="Clear text list">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"></path>
                      <path d="M22 21H7"></path>
                      <path d="m5 11 9 9"></path>
                    </svg>
                  </button>
                  <div id="urlTemplateItemsHistoryMenu" class="history-menu" hidden></div>
                </div>
              </div>
              <div class="template-textarea-wrapper">
                <textarea id="urlTemplateItems" spellcheck="false" data-i18n-placeholder="urlTemplateItemsPlaceholder" wrap="off" class="no-wrap"></textarea>
              </div>
            </div>
          </div>

          <button id="showPreviewButton" type="button" class="builder-preview" aria-haspopup="dialog" aria-controls="urlPreviewPanel">
            <span class="preview-summary">
              <span class="preview-kicker" data-i18n="templatePreviewLabel">Preview</span>
              <strong id="urlPreviewCount">0 URLs</strong>
            </span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--text-muted)">
              <path d="M5 12h14"></path>
              <path d="m12 5 7 7-7 7"></path>
            </svg>
          </button>
        </div>
      </section>

      <section id="linkSelectorPanel" class="link-selector-panel" aria-labelledby="linkSelectorTitle" hidden>
        <div class="link-selector-head">
          <div>
            <h2 id="linkSelectorTitle" data-i18n="linkSelectorTitle">Select links</h2>
            <p id="linkSelectorSummary">0 selected</p>
          </div>
          <button id="linkSelectorCloseButton" type="button" class="history-button" data-i18n-title="linkSelectorCloseButton" aria-label="Close">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 6 6 18"></path>
              <path d="m6 6 12 12"></path>
            </svg>
          </button>
        </div>
        <div class="link-selector-tools">
          <input id="linkSelectorSearch" type="search" spellcheck="false" data-skip-save="true" data-i18n-placeholder="linkSelectorSearchPlaceholder">
          <button id="linkSelectorAllButton" type="button" class="filter-button" data-i18n="linkSelectorAllButton">All</button>
          <button id="linkSelectorNoneButton" type="button" class="filter-button" data-i18n="linkSelectorNoneButton">None</button>
          <button id="linkSelectorInvertButton" type="button" class="filter-button" data-i18n="linkSelectorInvertButton">Invert</button>
        </div>
        <div id="linkSelectorList" class="link-selector-list"></div>
        <div class="link-selector-foot">
          <button id="linkSelectorCancelButton" type="button" class="secondary neutral compact-button" data-i18n="linkSelectorCancelButton">Cancel</button>
          <button id="linkSelectorApplyButton" type="button" class="compact-button" data-i18n="linkSelectorApplyButton" disabled>Add to list</button>
        </div>
      </section>

      <section id="urlPreviewPanel" class="link-selector-panel url-preview-panel" aria-labelledby="previewPanelTitle" hidden>
        <div class="link-selector-head">
          <div>
            <h2 id="previewPanelTitle" data-i18n="previewPanelTitle">Generated URLs</h2>
            <p id="previewPanelSummary">0 URLs</p>
          </div>
          <button id="previewPanelCloseButton" type="button" class="history-button" data-i18n-title="closePreviewButton" aria-label="Close preview">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 6 6 18"></path>
              <path d="m6 6 12 12"></path>
            </svg>
          </button>
        </div>
        <div id="previewPanelList" class="link-selector-list url-preview-list"></div>
      </section>

      <section id="captureSettings" class="grid">
        <div class="field folder-field">
          <label for="folder" data-i18n="folderLabel" data-i18n-title="folderTooltip">Folder</label>
          <input id="folder" type="text" data-i18n-placeholder="folderPlaceholder" data-i18n-title="folderTooltip">
        </div>

        <div class="field delay-field">
          <label for="delay" data-i18n="delayLabel" data-i18n-title="delayTooltip">Delay</label>
          <input id="delay" type="number" min="0" max="30" step="0.5" value="1" inputmode="decimal" data-i18n-title="delayTooltip">
        </div>


      </section>

      <section id="schedulePanel" class="schedule-panel" aria-labelledby="schedulePanelTitle" hidden>
        <div class="schedule-panel-head">
          <strong id="schedulePanelTitle" data-i18n="scheduleLabel">Schedule</strong>
          <button id="schedulePanelCloseButton" type="button" class="history-button" data-i18n-title="linkSelectorCloseButton" aria-label="Close">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 6 6 18"></path>
              <path d="m6 6 12 12"></path>
            </svg>
          </button>
        </div>
        <div class="schedule-panel-body">
          <div id="scheduleTaskList" class="schedule-task-list"></div>
          <div id="scheduleUrlPreview" class="schedule-url-preview"></div>
          <div class="schedule-actions-row">
            <input id="scheduleAt" type="datetime-local" data-skip-save="true">
            <input id="scheduleName" type="text" data-skip-save="true" data-i18n-placeholder="scheduleNamePlaceholder">
            <button id="scheduleNewButton" type="button" class="icon-button" data-i18n-title="scheduleNewButton" aria-label="New">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 5v14"></path>
                <path d="M5 12h14"></path>
              </svg>
            </button>
            <button id="scheduleSaveButton" type="button" class="icon-button" data-i18n-title="scheduleButton" aria-label="Schedule capture">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 5v14"></path>
                <path d="M5 12h14"></path>
              </svg>
            </button>
          </div>
        </div>
      </section>

      <footer class="footer">
        <p id="statusText" data-i18n="idleStatus">Ready.</p>
        <div class="actions">
          <button id="settingsButton" type="button" class="secondary neutral" data-i18n-title="settingsButton" aria-label="Settings">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </button>
          <button id="stopButton" type="button" class="secondary" data-i18n-title="stopButton" aria-label="Stop" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect>
            </svg>
          </button>
          <button id="pauseButton" type="button" class="secondary" data-i18n-title="pauseButton" aria-label="Pause" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="6" y="4" width="4" height="16" rx="1"></rect>
              <rect x="14" y="4" width="4" height="16" rx="1"></rect>
            </svg>
          </button>
          <div class="split-button-group">
            <button id="startButton" type="button" data-i18n-title="startButton" aria-label="Start">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
              </svg>
            </button>
            <button id="scheduleButton" type="button" class="split-trigger" data-i18n-title="scheduleButton" aria-label="Schedule capture" aria-expanded="false" aria-controls="schedulePanel">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M12 6v6l4 2"></path>
              </svg>
            </button>
          </div>
        </div>
      </footer>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
